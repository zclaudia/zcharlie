# 港美受控身份名单（hk-us-expansion W1 任务 01 的人工核对产物）。
#
# 这是应用内港美证券身份的**权威**：不由模型输出，不取自上游响应，不因名称
# 相近或代码相似合并公司。每条身份的字段都对照已保存的调研证据核对：
# 东财原币端点的代码与报表币种、Yahoo chart 的请求代码、SEC Submissions 的
# 发行人标识（见 research/market-data-validation/evidence/remaining-final-03/）。
#
# 约定：
# - ticker 是应用内存储代码：港股五位含前导零（"00002"），美股大写（"AAPL"）。
# - quote_currency 是证券报价币种，report_currency 是报表币种，两者独立；
#   Market.currency（市场默认报价币种）不得顶替证券报表币种。
# - sources 里的 symbol 是该来源实际使用的代码，按来源单独保存，不互相换算：
#     eastmoney.hk.native.v1 -> 东财 SECUCODE（"00005.HK"）
#     yahoo.chart.v1         -> Yahoo chart 代码（"0005.HK"）
#     sec.companyfacts.v1    ->SEC CIK 十进制；CIK 是发行人标识，不等于股票
#                             类别或交易所标识。
# - valid_from 取核对所依据的调研证据取得日（2026-10-11），不回填更早时间。
# - 只有共享 company_key 才表示应用内共用同一个 Company；文件内不允许同名条目
#   靠名称复用，加载时由 validate_pilot_list 拒绝重复与自相矛盾。
