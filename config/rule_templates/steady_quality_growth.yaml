# 稳健质量成长 (steady quality growth) - template v2 (user review P1-F2,
# 2026-10-07); format v3 (2026-10-09): strategy notes, condition labels and
# parameter labels moved out of comments into fields.
#
# Source archetype: research_kernel classify_stock "steady_quality_growth"
# (growth industries, ROE >= 12%, 3y revenue growth in [6%, 18%), positive
# FCF, dividend yield >= 1.5%, debt ratio <= 55%) and its scoring weights
# (profitability 20, growth durability 20, ROE stability 15, cash flow 15,
# balance sheet 10, shareholder return 10, valuation 10).
#
# v2 (review 2026-10-07):
# * Q3: the archetype's "debt ratio <= 55%" is back in the screen.
# * Q6: ROE is bounded above (40%).
# * The archetype's "dividend yield >= 1.5%" is still not a screen condition
#   (adding it is a calibration question, not part of this review).
id: steady_quality_growth
name: 稳健质量成长
description: >-
  Consistently profitable, moderately growing companies with low volatility
  and a valuation in the lower-middle of their 5-year range.
calibration_status: uncalibrated
applicable_groups: [growth_manufacturing, consumer, healthcare, utility]

thesis: 盈利持续稳定、中速增长、负债适中、股价波动低的公司，在估值处于自身 5 年区间中低位时，以稳健复利为主要回报。
fits:
  - 消费、医药、制造、公用事业中经营稳定的成熟型公司
avoids:
  - 增速过快、波动大的高成长股（见质量成长、高成长风险投资）
  - 负债率高的公司
  - ROE 异常偏高（多为净资产塌缩）的公司
risks:
  - 增长放缓到停滞
  - 与质量成长模板条件重叠，同一只股票可能同时命中两个模板
falsification: ROE 走低、ROE 稳定性被打破或负债率明显上升，说明“稳健”不再成立。
horizon: 3 年以上

screen:
  all:
    - factor: roe
      op: between
      value: ["$roe_min", "$roe_max"]
      label: 盈利能力
      why: 原型 ROE ≥ 12%；上限防净资产塌缩造成的虚高（评审 Q6）。
    - factor: roe_stability
      op: ">="
      value: "$roe_stability_min"
      label: 稳定性
      why: 与质量成长模板相比的核心特征。
    - factor: revenue_growth_3y
      op: between
      value: ["$revenue_growth_min", "$revenue_growth_max"]
      label: 中速增长
      why: 原型为 3 年营收增速 [6%, 18%)。
    - factor: net_profit_growth_3y
      op: ">="
      value: "$profit_growth_min"
      label: 利润增长
      why: 利润持续增长。
    - factor: net_margin
      op: ">="
      value: "$net_margin_min"
      label: 盈利质量
      why: 净利率作为盈利质量的代理。
      data_note: 未使用自由现金流（原型要求 FCF > 0），用净利率代替。
    - factor: debt_ratio
      op: "<="
      value: "$debt_ratio_max"
      label: 资产负债表
      why: 原型负债率 ≤ 55%（评审 Q3 重新加入筛选）。
      data_note: 东财兜底后目标池全覆盖（P1-A11/A12）。
    - factor: volatility_1y
      op: "<="
      value: "$volatility_max"
      label: 走势稳健
      why: 稳健的价格表现。
    - factor: pe_percentile_5y
      op: "<="
      value: "$pe_pct_max"
      label: 估值不贵
      why: 估值不在自身 5 年高位。

candidate_zones:
  buy_zone:
    all:
      - {factor: pe_percentile_5y, op: "<=", value: "$buy_pe_pct_max", label: 估值进入低位}
  drop:
    any:
      - {factor: pe_percentile_5y, op: ">", value: "$drop_pe_pct_min", label: 估值过高}
      - {factor: roe_stability, op: "<", value: "$drop_roe_stability_max", label: 稳定性被打破}
      - {factor: net_profit_growth_3y, op: "<", value: 0.0, label: 利润负增长}

holding_zones:
  add:
    all:
      - {factor: pe_percentile_5y, op: "<=", value: "$add_pe_pct_max", label: 估值低位}
      - {factor: position_weight, op: "<", value: "$add_weight_max", label: 仓位未满, data_note: 仓位因子：由每日区间检测从当日估值计算（无可用估值或成本未知时不触发）}
  trim:
    any:
      - {factor: pe_percentile_5y, op: ">=", value: "$trim_pe_pct_min", label: 估值高位}
      - {factor: gain_vs_cost, op: ">=", value: "$trim_gain_min", label: 浮盈较大, data_note: 仓位因子：由每日区间检测从当日估值计算（无可用估值或成本未知时不触发）}
      - {factor: position_weight, op: ">", value: "$trim_weight_min", label: 仓位过重, data_note: 仓位因子：由每日区间检测从当日估值计算（无可用估值或成本未知时不触发）}
  exit_review:
    any:
      - {factor: roe, op: "<", value: "$exit_roe_max", label: ROE 走低, why: 证伪：盈利能力下滑。}
      - {factor: roe_stability, op: "<", value: 0.40, label: 稳定性崩坏, why: 证伪：不再稳健。}
      - {factor: debt_ratio, op: ">", value: "$exit_debt_ratio_min", label: 负债过高, why: 原型负债率 ≤ 55%，超过 70% 触发复核；数据缺失时不触发。}

params:
  roe_min: {default: 0.12, range: [0.08, 0.20], label: ROE 下限}
  roe_max: {default: 0.40, range: [0.25, 0.60], label: ROE 上限, help: 稳健型公司 ROE 超过 40% 更可能是净资产塌缩，而非护城河。}
  roe_stability_min: {default: 0.80, range: [0.50, 0.95], label: ROE 稳定性下限}
  revenue_growth_min: {default: 0.06, range: [0.0, 0.10], label: 3 年营收增速下限}
  revenue_growth_max: {default: 0.18, range: [0.12, 0.30], label: 3 年营收增速上限}
  profit_growth_min: {default: 0.05, range: [0.0, 0.15], label: 3 年利润增速下限}
  net_margin_min: {default: 0.08, range: [0.03, 0.20], label: 净利率下限}
  debt_ratio_max: {default: 0.55, range: [0.40, 0.70], label: 负债率上限}
  volatility_max: {default: 0.45, range: [0.25, 0.60], label: 年化波动率上限}
  pe_pct_max: {default: 0.60, range: [0.30, 0.90], label: PE 5 年分位上限}
  buy_pe_pct_max: {default: 0.30, range: [0.10, 0.50], label: 可研究区间 PE 分位上限}
  drop_pe_pct_min: {default: 0.85, range: [0.70, 0.98], label: 移出候选 PE 分位}
  drop_roe_stability_max: {default: 0.60, range: [0.30, 0.75], label: 移出候选 ROE 稳定性}
  add_pe_pct_max: {default: 0.25, range: [0.05, 0.50], label: 持仓 add 区间 PE 分位上限}
  add_weight_max: {default: 0.10, range: [0.02, 0.20], label: 持仓 add 区间仓位上限}
  trim_pe_pct_min: {default: 0.90, range: [0.70, 0.99], label: 持仓 trim 区间 PE 分位}
  trim_gain_min: {default: 0.40, range: [0.20, 1.00], label: 持仓 trim 区间浮盈}
  trim_weight_min: {default: 0.15, range: [0.08, 0.30], label: 持仓 trim 区间仓位}
  exit_roe_max: {default: 0.08, range: [0.03, 0.12], label: 复核 ROE 线}
  exit_debt_ratio_min: {default: 0.70, range: [0.55, 0.90], label: 复核负债率线}
