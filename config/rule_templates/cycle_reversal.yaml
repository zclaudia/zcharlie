# First-import baseline of the rule store (config-docs-plan CD5/CD6): after
# `ia rules sync` seeds an empty store the DB is authoritative and these files
# are never re-imported silently - later versions are authored at
# /app/templates (从基线导入 pulls a file back in explicitly).
#
# 周期反转 (cycle reversal) - template v2 (user review P1-F2, 2026-10-07);
# format v3 (2026-10-09): strategy notes, condition labels and parameter
# labels moved out of comments into fields.
#
# Source archetype: research_kernel classify_stock "cycle_reversal" (cycle
# industries 有色/煤炭/石油/化工/钢铁/航运/能源/矿, 1y max drawdown >= 30%,
# revenue growth >= 10% as a bonus) and its scoring weights (cycle position
# 30 = drawdown, cost advantage 25 = ROE, resource reserve 20 = profit
# growth, balance sheet 15, valuation 10).
#
# v2 (review Q6): ROE is bounded above (default 40%); v1 hit 600221 海航控股
# at 52.5% from a collapsed equity base. Q7 moved airports / ports to
# `utility`, so 600009 上海机场 no longer reaches this template.
#
# Exit discipline: floating profit is not a trim reason. trim adds an
# uncalibrated PE(TTM) absurdity line beside the PB-percentile trim. PE is a
# poor cyclical measure at the trough (depressed earnings inflate it); the
# line is only a starting default, and a missing or non-positive PE does not
# fire. exit_sell is the falsified-thesis sell signal; the holding-time
# limit only queues a re-review. Trim, sell and re-review require
# streak_periods consecutive hits (uncalibrated default).
#
# Screen entry: the shared accounting-quality pre-screen
# (ocf_to_net_income, share_dilution, interest_coverage) runs before these
# conditions. Banks and insurers are exempt. The three thresholds below are
# uncalibrated starting defaults.
id: cycle_reversal
name: 周期反转
description: >-
  Cyclicals after a deep drawdown, cheap versus their own 5-year PB range,
  still profitable (cost-advantaged survivors of the trough).
calibration_status: uncalibrated
applicable_groups: [cyclical]

thesis: 周期股深度下跌、PB 处在自身 5 年区间低位，而低谷期仍能盈利的成本领先者，在周期回升时有估值修复空间。
fits:
  - 有色、煤炭、化工、钢铁、航运等周期行业中的龙头或低成本企业
avoids:
  - 低谷期已亏损、靠融资续命的公司
  - 市值过小、抗风险能力弱的公司
  - 因亏损导致净资产塌缩、ROE 虚高的公司
risks:
  - 周期底部持续时间超预期
  - 行业供给格局变化，低成本优势消失
  - 资产负债表在低谷期恶化
falsification: 转为亏损、负债率过高，或持有超过两年周期仍未回升，说明反转逻辑不成立。
horizon: 1-3 年（一个周期）

screen:
  all:
    - factor: max_drawdown_1y
      op: ">="
      value: "$drawdown_min"
      label: 周期位置
      why: 近一年深度下跌（原型 ≥ 30%）。
    - factor: pb_percentile_5y
      op: "<="
      value: "$pb_pct_max"
      label: 估值低位
      why: 相对自身周期历史便宜；用 PB 而非 PE，因为低谷盈利会扭曲 PE。
    - factor: roe
      op: between
      value: ["$roe_min", "$roe_max"]
      label: 成本优势
      why: 低谷期仍盈利；ROE 超过上限通常是净资产塌缩，不是成本领先（评审 Q6）。
    - factor: market_cap
      op: ">="
      value: "$market_cap_min"
      label: 规模门槛
      why: 只看能熬过低谷的幸存者，排除最小、最脆弱的公司。

candidate_zones:
  buy_zone:
    all:
      - {factor: pb_percentile_5y, op: "<=", value: "$buy_pb_pct_max", label: PB 进入低位}
  drop:
    any:
      - {factor: pb_percentile_5y, op: ">", value: "$drop_pb_pct_min", label: 估值已修复, why: 已重估或离开低谷。}
      - {factor: roe, op: "<", value: 0.0, label: 转为亏损, why: 不再是低谷期的成本领先者。}
      - {factor: debt_ratio, op: ">", value: "$drop_debt_ratio_min", label: 负债压力, why: 资产负债表承压；数据缺失时不触发。}

holding_zones:
  add:
    all:
      - {factor: pb_percentile_5y, op: "<=", value: "$add_pb_pct_max", label: PB 低位}
      - {factor: position_weight, op: "<", value: "$add_weight_max", label: 仓位未满, data_note: 仓位因子：由每日区间检测从当日估值计算（无可用估值或成本未知时不触发）}
  trim:
    any:
      - {factor: pb_percentile_5y, op: ">=", value: "$trim_pb_pct_min", label: 估值回到高位, why: 周期股在强势时减持。, min_periods: "$streak_periods"}
      - {factor: pe_ttm, op: ">=", value: "$trim_pe_absurd", label: 估值离谱, why: 现价相对盈利的倍数高到离谱才提示减仓；浮盈只说明买入代价，不是卖出理由。, data_note: 未校准的起始默认值，不是研究过的 A 股参数。低谷盈利会抬高 PE；pe_ttm 缺失或非正时不触发。PB 分位仍是周期估值的主条件。, min_periods: "$streak_periods"}
      - {factor: position_weight, op: ">", value: "$trim_weight_min", label: 仓位过重, data_note: 仓位因子：由每日区间检测从当日估值计算（无可用估值或成本未知时不触发）, min_periods: "$streak_periods"}
  exit_sell:
    any:
      - {factor: roe, op: "<", value: "$exit_roe_max", label: 亏损扩大, why: 证伪即卖：成本优势不在。, min_periods: "$streak_periods"}
      - {factor: debt_ratio, op: ">", value: 0.85, label: 负债过高, why: 证伪即卖：资产负债表无法支撑等待。, min_periods: "$streak_periods"}
  exit_review:
    any:
      - {factor: holding_days, op: ">", value: "$exit_holding_days_min", label: 持有超时, why: 触发重审：反转逻辑的时间到了，只进入重审队列，不作为卖出信号。, data_note: 仓位因子：由每日区间检测从当日估值计算（无可用估值或成本未知时不触发）, min_periods: "$streak_periods"}

params:
  drawdown_min: {default: 0.30, range: [0.20, 0.60], label: 近一年最大回撤下限}
  pb_pct_max: {default: 0.30, range: [0.10, 0.50], label: PB 5 年分位上限}
  roe_min: {default: 0.05, range: [0.0, 0.12], label: ROE 下限}
  roe_max:
    default: 0.40
    range: [0.25, 0.60]
    label: ROE 上限
    help: 远高于周期股低谷盈利的 ROE 多来自亏损后净资产塌缩。
  market_cap_min: {default: 5.0e+10, range: [2.0e+10, 2.0e+11], label: 市值下限}
  buy_pb_pct_max: {default: 0.15, range: [0.05, 0.30], label: 可研究区间 PB 分位上限}
  drop_pb_pct_min: {default: 0.60, range: [0.40, 0.90], label: 移出候选 PB 分位}
  drop_debt_ratio_min: {default: 0.80, range: [0.65, 0.95], label: 移出候选负债率}
  add_pb_pct_max: {default: 0.10, range: [0.02, 0.25], label: 持仓 add 区间 PB 分位上限}
  add_weight_max: {default: 0.06, range: [0.02, 0.15], label: 持仓 add 区间仓位上限}
  trim_pb_pct_min: {default: 0.80, range: [0.60, 0.98], label: 持仓 trim 区间 PB 分位}
  trim_pe_absurd:
    default: 50
    range: [20, 120]
    label: 持仓 trim 估值离谱线
    help: 未校准的起始默认值，不是研究过的 A 股参数。低谷盈利会抬高 PE，这条倍数只是起始线，与买入成本无关。
  trim_weight_min: {default: 0.10, range: [0.05, 0.25], label: 持仓 trim 区间仓位}
  exit_roe_max: {default: -0.02, range: [-0.10, 0.05], label: 证伪 ROE 线}
  exit_holding_days_min: {default: 730, range: [180, 1460], label: 重审持有天数}
  ocf_to_net_income_min:
    default: 0.8
    range: [0.2, 1.5]
    label: 经营现金流/净利润下限
    help: 未校准的起始默认值，不是研究过的 A 股参数。因子 ocf_to_net_income，最近一期年报经营现金流/净利润；低于这条线不进入候选。净利润非正或数据缺失时检查不通过。
  share_dilution_max:
    default: 0.05
    range: [0.0, 0.30]
    label: 股本稀释上限
    help: 未校准的起始默认值，不是研究过的 A 股参数。因子 share_dilution，最近两期年报总股本增幅；高于这条线不进入候选。缺股本时检查不通过。
  interest_coverage_min:
    default: 3.0
    range: [1.0, 15.0]
    label: 利息覆盖下限
    help: 未校准的起始默认值，不是研究过的 A 股参数。因子 interest_coverage，（营业利润+财务费用）/财务费用，财务费用不是单独的利息支出；低于这条线不进入候选。数据缺失时检查不通过，财务费用非正时该信号不适用。银行和保险公司豁免这三项。
  streak_periods:
    default: 3
    range: [1, 12]
    label: 连续期数
    help: 未校准的起始默认值，不是研究过的 A 股参数。减仓、证伪卖出和重审都要连续这么多期成立，用来过滤单期噪声。
