# 红利蓝筹 (dividend blue chip) - template v1 DRAFT for user review (P1-F2).
#
# Source archetype: research_kernel classify_stock "dividend_blue_chip"
# (dividend industries 公用事业/银行/运营商/电力/高速, market cap >= 3000亿,
# dividend yield >= 2.5%, positive FCF) and its scoring weights (FCF 25,
# dividend yield 20, ROE stability 20, debt 15, valuation 15, growth 5).
#
# KNOWN GAP: the factor library has no dividend-yield factor (and free cash
# flow is iFinD-only, missing on the baostock target-pool path). This
# template approximates "able and willing to pay" with regulated / bank
# industry groups + scale + stable ROE + non-shrinking profit + low
# volatility, and "cheap" with the 5-year PB percentile (banks are valued on
# PB; their PE percentiles are distorted by shrinking earnings). Add
# dividend_yield to the screen once the factor exists.
#
# debt_ratio is not_applicable for banks and missing for ~half of the other
# members until the Eastmoney fallback lands, so it is only used in
# exit_review (a missing factor never triggers a zone).
id: dividend_blue_chip
name: 红利蓝筹
description: >-
  Large, stable-profit utilities and banks trading in the lower half of their
  5-year PB range. Dividend yield is not yet a factor (known gap).
calibration_status: uncalibrated
applicable_groups: [utility, banking]

screen:
  all:
    # Scale: blue chips only (archetype used 3000亿 as a fit bonus; 1000亿
    # keeps mid-size regional utilities and city banks in view).
    - {factor: market_cap, op: ">=", value: "$market_cap_min"}
    # Profitability floor: banks' median ROE is ~9%, utilities ~10%.
    - {factor: roe, op: ">=", value: "$roe_min"}
    # Payout capacity proxy: 4 annual ROEs with low dispersion.
    - {factor: roe_stability, op: ">=", value: "$roe_stability_min"}
    # Earnings must not be shrinking (dividend sustainability proxy).
    - {factor: net_profit_growth_3y, op: ">=", value: "$profit_growth_min"}
    # Defensive price behaviour.
    - {factor: volatility_1y, op: "<=", value: "$volatility_max"}
    # Valuation: lower part of the stock's own 5-year PB range.
    - {factor: pb_percentile_5y, op: "<=", value: "$pb_pct_max"}

candidate_zones:
  buy_zone:
    all:
      # Actionable when PB sits in the bottom third of its 5-year range.
      - {factor: pb_percentile_5y, op: "<=", value: "$buy_pb_pct_max"}
  drop:
    any:
      # Valuation has normalised: no longer a value entry.
      - {factor: pb_percentile_5y, op: ">", value: "$drop_pb_pct_min"}
      # Profitability broke below the floor.
      - {factor: roe, op: "<", value: "$drop_roe_max"}
      # Earnings started shrinking materially.
      - {factor: net_profit_growth_3y, op: "<", value: -0.10}

holding_zones:
  add:
    all:
      - {factor: pb_percentile_5y, op: "<=", value: "$add_pb_pct_max"}
      - {factor: position_weight, op: "<", value: "$add_weight_max"}   # P2 factor
  trim:
    any:
      - {factor: pb_percentile_5y, op: ">=", value: "$trim_pb_pct_min"}
      - {factor: position_weight, op: ">", value: "$trim_weight_min"}  # P2 factor
  exit_review:
    any:
      # Falsification: profitability or earnings trend broken.
      - {factor: roe, op: "<", value: "$exit_roe_max"}
      - {factor: net_profit_growth_3y, op: "<", value: -0.15}
      # Leverage blow-out (non-financials only; banks: not_applicable).
      - {factor: debt_ratio, op: ">", value: 0.85}

params:
  market_cap_min: 1.0e+11
  roe_min: 0.08
  roe_stability_min: 0.80
  profit_growth_min: -0.05
  volatility_max: 0.30
  pb_pct_max: 0.50
  buy_pb_pct_max: 0.30
  drop_pb_pct_min: 0.80
  drop_roe_max: 0.06
  add_pb_pct_max: 0.20
  add_weight_max: 0.10
  trim_pb_pct_min: 0.90
  trim_weight_min: 0.15
  exit_roe_max: 0.05

param_ranges:
  market_cap_min: {min: 3.0e+10, max: 5.0e+11}
  roe_min: {min: 0.05, max: 0.15}
  roe_stability_min: {min: 0.50, max: 0.95}
  profit_growth_min: {min: -0.15, max: 0.05}
  volatility_max: {min: 0.20, max: 0.45}
  pb_pct_max: {min: 0.20, max: 0.80}
  buy_pb_pct_max: {min: 0.05, max: 0.50}
  drop_pb_pct_min: {min: 0.60, max: 0.95}
  drop_roe_max: {min: 0.03, max: 0.10}
  add_pb_pct_max: {min: 0.05, max: 0.40}
  add_weight_max: {min: 0.02, max: 0.20}
  trim_pb_pct_min: {min: 0.70, max: 0.99}
  trim_weight_min: {min: 0.08, max: 0.30}
  exit_roe_max: {min: 0.02, max: 0.08}
