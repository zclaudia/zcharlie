# 高成长风险投资 (high-growth venture) - template v1, kept unchanged by the
# user review (P1-F2, 2026-10-07: Q5 keeps revenue growth >= 25%; no ROE
# screen, so no Q6 cap); format v3 (2026-10-09): strategy notes, condition
# labels and parameter labels moved out of comments into fields.
#
# Source archetype: research_kernel classify_stock "high_growth_venture"
# (venture industries 半导体/AI/机器人/创新药/计算机/电子, 3y revenue growth
# >= 30%, market cap < 1000亿; always needs review) and its scoring
# weights (TAM 30 = revenue growth, technical barrier 25 = ROE, team 20,
# commercialization 15 = profit growth, cash reserve 10 = debt ratio).
id: high_growth_venture
name: 高成长风险投资
description: >-
  Fast-growing, high-gross-margin small/mid caps in software, internet,
  electronics/equipment and healthcare; valuation not at a 5-year high.
calibration_status: uncalibrated
applicable_groups: [venture, growth_manufacturing, healthcare]

thesis: 收入高速增长、毛利率高（技术壁垒）的中小市值科技与医药公司，在估值不处于自身 5 年高位时有高成长带来的上行空间。
fits:
  - 软件、互联网、电子与设备、创新药等成长赛道的中小市值公司
  - 尚未盈利或商业化滞后、但收入快速放量的公司
avoids:
  - 已是超大市值的公司
  - 收入增长来自并购或一次性项目的公司
risks:
  - 风险最高的模板，持仓区间的仓位上限比其他模板更紧
  - 亏损公司没有 PE 类因子（negative_earnings），估值只看 PB
  - 增长失速时估值回落剧烈
falsification: 收入增长停滞、毛利率（技术壁垒）被侵蚀或负债率过高，说明成长逻辑不成立。
horizon: 1-3 年，需频繁复核

screen:
  all:
    - factor: revenue_growth_3y
      op: ">="
      value: "$revenue_growth_min"
      label: 高速增长
      why: 市场空间与增长势头（原型 3 年营收复合增速 ≥ 30%，评审 Q5 保持 25%）。
    - factor: gross_margin
      op: ">="
      value: "$gross_margin_min"
      label: 技术壁垒
      why: 毛利率作为技术壁垒的代理。
    - factor: market_cap
      op: "<="
      value: "$market_cap_max"
      label: 中小市值
      why: 风险投资画像：尚未成为超大市值（原型 < 1000 亿）。
    - factor: pb_percentile_5y
      op: "<="
      value: "$pb_pct_max"
      label: 估值不在高位
      why: 不在自身 PB 区间顶部买入。
      data_note: 亏损公司 PE 类因子缺失，因此用 PB 分位。

candidate_zones:
  buy_zone:
    all:
      - {factor: pb_percentile_5y, op: "<=", value: "$buy_pb_pct_max", label: PB 进入低位}
  drop:
    any:
      - {factor: revenue_growth_3y, op: "<", value: "$drop_revenue_growth_max", label: 增长失速}
      - {factor: pb_percentile_5y, op: ">", value: "$drop_pb_pct_min", label: 估值过高}

holding_zones:
  add:
    all:
      - {factor: pb_percentile_5y, op: "<=", value: "$add_pb_pct_max", label: PB 低位}
      - {factor: position_weight, op: "<", value: "$add_weight_max", label: 仓位未满, data_note: 仓位因子：由每日区间检测从当日估值计算（无可用估值或成本未知时不触发）}
  trim:
    any:
      - {factor: gain_vs_cost, op: ">=", value: "$trim_gain_min", label: 浮盈较大, data_note: 仓位因子：由每日区间检测从当日估值计算（无可用估值或成本未知时不触发）}
      - {factor: position_weight, op: ">", value: "$trim_weight_min", label: 仓位过重, data_note: 仓位因子：由每日区间检测从当日估值计算（无可用估值或成本未知时不触发）}
      - {factor: pb_percentile_5y, op: ">=", value: "$trim_pb_pct_min", label: 估值高位}
  exit_review:
    any:
      - {factor: revenue_growth_3y, op: "<", value: "$exit_revenue_growth_max", label: 增长停滞, why: 证伪：成长不再。}
      - {factor: gross_margin, op: "<", value: "$exit_gross_margin_max", label: 毛利率被侵蚀, why: 证伪：技术壁垒消失。}
      - {factor: debt_ratio, op: ">", value: 0.70, label: 负债过高, why: 现金储备的代理；数据缺失时不触发。}

params:
  revenue_growth_min: {default: 0.25, range: [0.15, 0.50], label: 3 年营收增速下限}
  gross_margin_min: {default: 0.30, range: [0.15, 0.60], label: 毛利率下限}
  market_cap_max: {default: 1.0e+11, range: [3.0e+10, 3.0e+11], label: 市值上限}
  pb_pct_max: {default: 0.70, range: [0.30, 0.90], label: PB 5 年分位上限}
  buy_pb_pct_max: {default: 0.40, range: [0.10, 0.60], label: 可研究区间 PB 分位上限}
  drop_revenue_growth_max: {default: 0.10, range: [0.0, 0.20], label: 移出候选营收增速}
  drop_pb_pct_min: {default: 0.90, range: [0.70, 0.99], label: 移出候选 PB 分位}
  add_pb_pct_max: {default: 0.30, range: [0.05, 0.50], label: 持仓 add 区间 PB 分位上限}
  add_weight_max: {default: 0.04, range: [0.01, 0.10], label: 持仓 add 区间仓位上限, help: 风险最高的模板，仓位上限更紧。}
  trim_gain_min: {default: 1.00, range: [0.30, 3.00], label: 持仓 trim 区间浮盈}
  trim_weight_min: {default: 0.08, range: [0.04, 0.15], label: 持仓 trim 区间仓位}
  trim_pb_pct_min: {default: 0.95, range: [0.80, 0.99], label: 持仓 trim 区间 PB 分位}
  exit_revenue_growth_max: {default: 0.05, range: [-0.10, 0.15], label: 复核营收增速线}
  exit_gross_margin_max: {default: 0.20, range: [0.10, 0.40], label: 复核毛利率线}
