# First-import baseline of the rule store (config-docs-plan CD5/CD6): after
# `ia rules sync` seeds an empty store the DB is authoritative and these files
# are never re-imported silently - later versions are authored at
# /app/templates (从基线导入 pulls a file back in explicitly).
#
# 质量成长 (quality growth) - template v2 (user review P1-F2, 2026-10-07);
# format v3 (2026-10-09): strategy notes, condition labels and parameter
# labels moved out of comments into fields.
#
# Source archetype: research_kernel classify_stock "quality_growth" (growth
# industries 电力设备/新能源/自动化/汽车零部件/医药/高端制造, 3y revenue growth
# >= 18%, ROE >= 15%, market cap >= 1000亿 as a bonus) and the
# quality_growth scoring weights (industry space 25, competitive advantage
# 25, revenue growth 20, ROE 15, cash flow 10, valuation 5).
#
# v2 (review Q6): ROE is bounded above like the other templates, with a
# looser default (60%) because a very high, *stable* ROE is this template's
# thesis.
#
# Exit discipline: floating profit is not a trim reason. trim uses an
# uncalibrated PE(TTM) absurdity line. exit_sell is the falsified-thesis
# sell signal; exit_review only queues a re-review. Trim, sell and re-review
# all require streak_periods consecutive hits (uncalibrated default).
#
# Screen entry: the shared accounting-quality pre-screen
# (ocf_to_net_income, share_dilution, interest_coverage) runs before these
# conditions. Banks and insurers are exempt. The three thresholds below are
# uncalibrated starting defaults.
id: quality_growth
name: 质量成长
description: >-
  High-ROE, durable growers in manufacturing, consumer and healthcare whose
  valuation is not at the top of their own 5-year range.
calibration_status: uncalibrated
applicable_groups: [growth_manufacturing, consumer, healthcare]

thesis: 高且稳定的 ROE 代表竞争优势，叠加持续的收入与利润增长，长期复利；估值不在自身 5 年区间高位时值得研究。
fits:
  - 制造、消费、医药中有护城河的成长型公司
  - 轻资产、高分红但 ROE 长期稳定的品牌型公司
avoids:
  - ROE 来自一次性收益或净资产塌缩的公司
  - 估值已处在自身 5 年区间顶部的公司
risks:
  - 增速放缓导致估值与盈利双杀
  - 营收口径为主营收入近似，可能与报表总营收有偏差
falsification: 毛利率、ROE 或利润增速明显恶化，说明质量与成长逻辑不再成立。
horizon: 2-5 年
examples:
  - {ticker: 605499.SH, note: 高且稳定的 ROE（约 51.6%），评审 Q6 放宽 ROE 上限的原因}

screen:
  all:
    - factor: roe
      op: between
      value: ["$roe_min", "$roe_max"]
      label: 竞争优势
      why: 高 ROE 代表竞争优势（原型 ROE ≥ 15%）；上限防止净资产塌缩造成的虚高（评审 Q6）。
    - factor: roe_stability
      op: ">="
      value: "$roe_stability_min"
      label: ROE 持续性
      why: 排除一次性冲高的 ROE。
    - factor: revenue_growth_3y
      op: ">="
      value: "$revenue_growth_min"
      label: 收入增长
      why: 原型为 3 年营收复合增速 ≥ 18%；默认取 15%。
      data_note: baostock 口径为主营收入（main_business_revenue 标记），是营收的近似。
    - factor: net_profit_growth_3y
      op: ">="
      value: "$profit_growth_min"
      label: 利润增长
      why: 增长要转化为利润。
    - factor: gross_margin
      op: ">="
      value: "$gross_margin_min"
      label: 定价能力
      why: 毛利率作为定价能力的代理。
      data_note: 自由现金流仅 iFinD 提供，目标池路径缺失，用毛利率代替。
    - factor: pe_percentile_5y
      op: "<="
      value: "$pe_pct_max"
      label: 估值不贵
      why: 估值不在自身 5 年历史高位（原型中估值权重仅 5）。

candidate_zones:
  buy_zone:
    all:
      - {factor: pe_percentile_5y, op: "<=", value: "$buy_pe_pct_max", label: 估值进入低位}
  drop:
    any:
      - {factor: pe_percentile_5y, op: ">", value: "$drop_pe_pct_min", label: 估值过高}
      - {factor: revenue_growth_3y, op: "<", value: "$drop_revenue_growth_max", label: 增长失速}
      - {factor: roe, op: "<", value: "$drop_roe_max", label: ROE 走弱}

holding_zones:
  add:
    all:
      - {factor: pe_percentile_5y, op: "<=", value: "$add_pe_pct_max", label: 估值低位}
      - {factor: position_weight, op: "<", value: "$add_weight_max", label: 仓位未满, data_note: 仓位因子：由每日区间检测从当日估值计算（无可用估值或成本未知时不触发）}
  trim:
    any:
      - {factor: pe_percentile_5y, op: ">=", value: "$trim_pe_pct_min", label: 估值高位, min_periods: "$streak_periods"}
      - {factor: pe_ttm, op: ">=", value: "$trim_pe_absurd", label: 估值离谱, why: 现价相对盈利的倍数高到离谱才提示减仓；浮盈只说明买入代价，不是卖出理由。, data_note: 未校准的起始默认值，不是研究过的 A 股参数。pe_ttm 缺失或非正（negative_earnings）时不触发。, min_periods: "$streak_periods"}
      - {factor: position_weight, op: ">", value: "$trim_weight_min", label: 仓位过重, data_note: 仓位因子：由每日区间检测从当日估值计算（无可用估值或成本未知时不触发）, min_periods: "$streak_periods"}
  exit_sell:
    any:
      - {factor: gross_margin, op: "<", value: "$exit_gross_margin_max", label: 毛利率恶化, why: 证伪即卖：定价能力消失。, min_periods: "$streak_periods"}
      - {factor: roe, op: "<", value: "$exit_roe_max", label: ROE 恶化, why: 证伪即卖：竞争优势消失。, min_periods: "$streak_periods"}
      - {factor: net_profit_growth_3y, op: "<", value: 0.0, label: 利润负增长, why: 证伪即卖：成长不再。, min_periods: "$streak_periods"}
  exit_review:
    any:
      - {factor: revenue_growth_3y, op: "<", value: "$review_revenue_growth_max", label: 增长放缓, why: 触发重审：增速放缓，论文尚未被证伪，只进入重审队列，不作为卖出信号。, min_periods: "$streak_periods"}

params:
  roe_min: {default: 0.15, range: [0.10, 0.25], label: ROE 下限}
  roe_max:
    default: 0.60
    range: [0.40, 1.00]
    label: ROE 上限
    help: 防净资产塌缩造成的虚高；高且稳定的 ROE 是本模板的核心，默认比其他模板宽，单股可收紧到 40%。
  roe_stability_min: {default: 0.70, range: [0.40, 0.95], label: ROE 稳定性下限}
  revenue_growth_min: {default: 0.15, range: [0.08, 0.30], label: 3 年营收增速下限}
  profit_growth_min: {default: 0.12, range: [0.05, 0.30], label: 3 年利润增速下限}
  gross_margin_min: {default: 0.25, range: [0.15, 0.50], label: 毛利率下限}
  pe_pct_max: {default: 0.60, range: [0.30, 0.90], label: PE 5 年分位上限}
  buy_pe_pct_max: {default: 0.30, range: [0.10, 0.50], label: 可研究区间 PE 分位上限}
  drop_pe_pct_min: {default: 0.85, range: [0.70, 0.98], label: 移出候选 PE 分位}
  drop_revenue_growth_max: {default: 0.05, range: [0.0, 0.10], label: 移出候选营收增速}
  drop_roe_max: {default: 0.10, range: [0.05, 0.15], label: 移出候选 ROE}
  add_pe_pct_max: {default: 0.25, range: [0.05, 0.50], label: 持仓 add 区间 PE 分位上限}
  add_weight_max: {default: 0.08, range: [0.02, 0.20], label: 持仓 add 区间仓位上限}
  trim_pe_pct_min: {default: 0.90, range: [0.70, 0.99], label: 持仓 trim 区间 PE 分位}
  trim_pe_absurd:
    default: 60
    range: [30, 120]
    label: 持仓 trim 估值离谱线
    help: 未校准的起始默认值，不是研究过的 A 股参数。PE(TTM) 达到这条倍数才视为估值离谱；与买入成本无关。
  trim_weight_min: {default: 0.15, range: [0.08, 0.30], label: 持仓 trim 区间仓位}
  exit_gross_margin_max: {default: 0.18, range: [0.10, 0.30], label: 证伪毛利率线}
  exit_roe_max: {default: 0.08, range: [0.03, 0.12], label: 证伪 ROE 线}
  review_revenue_growth_max:
    default: 0.05
    range: [0.0, 0.15]
    label: 重审营收增速线
    help: 未校准的起始默认值。增速降到这条线以下只进入重审，不作为卖出信号。
  ocf_to_net_income_min:
    default: 0.8
    range: [0.2, 1.5]
    label: 经营现金流/净利润下限
    help: 未校准的起始默认值，不是研究过的 A 股参数。因子 ocf_to_net_income，最近一期年报经营现金流/净利润；低于这条线不进入候选。净利润非正或数据缺失时检查不通过。
  share_dilution_max:
    default: 0.05
    range: [0.0, 0.30]
    label: 股本稀释上限
    help: 未校准的起始默认值，不是研究过的 A 股参数。因子 share_dilution，最近两期年报总股本增幅；高于这条线不进入候选。缺股本时检查不通过。
  interest_coverage_min:
    default: 3.0
    range: [1.0, 15.0]
    label: 利息覆盖下限
    help: 未校准的起始默认值，不是研究过的 A 股参数。因子 interest_coverage，（营业利润+财务费用）/财务费用，财务费用不是单独的利息支出；低于这条线不进入候选。数据缺失时检查不通过，财务费用非正时该信号不适用。银行和保险公司豁免这三项。
  streak_periods:
    default: 3
    range: [1, 12]
    label: 连续期数
    help: 未校准的起始默认值，不是研究过的 A 股参数。减仓、证伪卖出和重审都要连续这么多期成立，用来过滤单期噪声。
