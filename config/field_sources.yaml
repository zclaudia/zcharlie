# Field source registry (P1-A12, decision D6 rev 2; docs/product/p1-plan.md 2.3).
#
# One entry per canonical factor-layer field (the B1 split names: never the
# ambiguous stored names `net_profit` / `revenue`). The factor view resolves
# every financial field in this order:
#
#   1. a value verified by iFinD (`provider = ifind` row whose
#      `fields.verification[<field>] == "verified"`; written by P1-A13);
#   2. `primary`;
#   3. each `fallback` in order.
#
# A candidate failing its provider's `sanity` rule is skipped (recorded as
# rejected, flag `suspect_provider_value`) and the next source is tried.
# Values of other free sources that differ from the chosen one by more than
# `tolerance` (relative) mark the field `conflict`. iFinD is never a primary
# or fallback source: it only verifies (budgeted on-demand checks, P1-A13).
#
# Keys:
#   table      financial (financial_snapshot.fields, resolved per report period)
#              | derived (computed in the view from other registered fields)
#              | market (market_snapshot columns, baostock bars)
#              | report_overdue (report_overdue records)
#              | dividend (dividend_event rows, baostock query_dividend_data)
#              | earnings (earnings_forecast / disclosure_schedule /
#                business_segment rows, Eastmoney via akshare; facts only,
#                never a factor input)
#   primary    baostock | akshare | derived
#   fallback   ordered list of baostock | akshare (default [])
#   definition 口径 (unit and meaning); must name the unit: one of
#              fraction | CNY | 元 | 万元 | % | shares | days | ratio | flag
#   tolerance  relative tolerance for cross-source comparison (default 0.02)
#   key        critical field: a conflict or a gap triggers iFinD verification
#   sanity     per provider: {min, max, reason}; a value outside is a provider
#              defect, not data
#   approx     per provider: true when that source only approximates the field
#   formula    derived fields only: "<field> <op> <field>", op in + - * /
#   calibration per provider: {checked_on: date, method, note} - when and how
#              the unit / meaning was checked against a live answer (p1-plan
#              2.1 / 2.2 live checks of 2026-10-06). Required for any provider
#              other than baostock / akshare (a new source never enters
#              uncalibrated); optional for those two.
#
# market table (mrd-intake B2, decision D2): the Tencent close quote
# (provider `tencent`, stored at 15:10) is the fallback of the baostock bar
# for the same trade date; readers take baostock once it is there, and a
# same-day `close` differing by more than `tolerance` (0.1 %) is a `conflict`
# in the factor view. Tencent calibration: qt.gtimg.cn live 2026-10-09 06:46
# CST (2026-10-08 close of 600519 / 000001 / 920748 / 000002; recorded in
# tests/fixtures/tencent/quotes_sample.txt).
#
# earnings table (mrd-intake C1, decision D3): Eastmoney 业绩预告 / 预约披露
# / 主营构成 through akshare 1.19.1, checked live 2026-10-09 07:46 CST
# (fixtures tests/fixtures/eastmoney/stock_yjyg_em_20260630.json,
# stock_yysj_em_20260930.json, stock_zygc_em_SH600519.json). These fields
# feed notifications and the rule-drafting facts; they never enter a factor.
version: "2026-10-09.3"
default_tolerance: 0.02

fields:
  # -- profitability (baostock profit table, pubDate-gated) ---------------- #
  roe:
    table: financial
    primary: baostock
    definition: "ROE on average equity (baostock roeAvg), fraction, period-to-date"
    key: true
    calibration:
      baostock:
        checked_on: 2026-10-06
        method: >-
          query_profit_data live (600519 et al.): fraction values and pubDate
          semantics (FY2025 2026-04-17, 2026H1 2026-08-15) checked by hand
  gross_margin:
    table: financial
    primary: baostock
    definition: "gross margin (gpMargin), fraction, period-to-date; null for banks"
  net_margin:
    table: financial
    primary: baostock
    definition: "net margin (npMargin), fraction, period-to-date"
  eps_ttm:
    table: financial
    primary: baostock
    definition: "EPS, trailing twelve months (epsTTM), CNY/share"
    key: true
    calibration:
      baostock:
        checked_on: 2026-10-06
        method: "query_profit_data live: epsTTM in CNY per share, cross-read with iFinD"
  total_shares:
    table: financial
    primary: baostock
    definition: "total shares (totalShare), effective from pubDate"
    key: true
    calibration:
      baostock:
        checked_on: 2026-10-06
        method: "query_profit_data live: totalShare is a share count (not 万股)"

  # -- balance sheet ------------------------------------------------------- #
  debt_ratio:
    table: financial
    primary: baostock
    fallback: [akshare]
    definition: >-
      total liabilities / total assets, fraction (baostock liabilityToAsset;
      Eastmoney stock_zcfz_em 资产负债率 percent / 100)
    key: true
    sanity:
      baostock:
        min: 0.02
        reason: >-
          baostock liabilityToAsset arrives scaled by 1/100 on some annual rows
          (FY2024 100%, 2025Q3 99.8%, FY2025 49.5% of rows; e.g. 600519 FY2024 0.0019)
    calibration:
      baostock:
        checked_on: 2026-10-06
        method: "query_balance_data live: liabilityToAsset fraction; 1/100 scaling defect found"
        note: "see sanity.baostock"
      akshare:
        checked_on: 2026-10-06
        method: >-
          stock_zcfz_em live (akshare 1.19.1): 资产负债率 is percent, equals
          负债-总负债 / 资产-总资产 x 100 on all 5243 FY2024 rows; stored / 100
  total_equity:
    table: financial
    primary: akshare
    definition: "total equity incl. minority interests (stock_zcfz_em 股东权益合计), CNY"

  # -- income statement ---------------------------------------------------- #
  net_profit_parent:
    table: financial
    primary: akshare
    definition: >-
      net profit attributable to the parent (归母净利润), CNY, period-to-date
      (stock_lrb_em 净利润 = PARENT_NETPROFIT)
    key: true
    calibration:
      akshare:
        checked_on: 2026-10-06
        method: >-
          stock_lrb_em live (akshare 1.19.1): 净利润 in CNY equals PARENT_NETPROFIT
          (600519 FY2024 86.23 bn, 601318 126.6 bn), not net profit incl. minority
  net_profit_total:
    table: financial
    primary: baostock
    definition: "net profit incl. minority interests (baostock netProfit), CNY, period-to-date"
  revenue_total:
    table: financial
    primary: akshare
    definition: "total operating revenue (营业总收入, stock_lrb_em), CNY, period-to-date"
    key: true
    calibration:
      akshare:
        checked_on: 2026-10-06
        method: "stock_lrb_em live: 营业总收入 in CNY (600519 FY2024 174.1 bn); banks report 营业收入"
  revenue_main:
    table: financial
    primary: baostock
    definition: "main-business revenue (baostock MBRevenue), CNY; not comparable with revenue_total"

  # -- cash flow ----------------------------------------------------------- #
  operating_cash_flow:
    table: financial
    primary: akshare
    fallback: [baostock]
    definition: >-
      net cash flow from operating activities, CNY, period-to-date (Eastmoney
      经营性现金流-现金流量净额 / NETCASH_OPERATE; baostock fallback is
      CFOToNP x netProfit, approx)
    key: true
    approx:
      baostock: true
    calibration:
      akshare:
        checked_on: 2026-10-06
        method: >-
          stock_xjll_em 经营性现金流-现金流量净额 and the per-stock statement's
          NETCASH_OPERATE live, both CNY (600519 FY2024 92.46 bn)
      baostock:
        checked_on: 2026-10-06
        method: "query_cash_flow_data live: CFOToNP is a ratio; CFOToNP x netProfit approximates CNY"
        note: "approximation, never raises a conflict"
  capital_expenditure:
    table: financial
    primary: akshare
    definition: >-
      cash paid for fixed / intangible / other long-term assets
      (CONSTRUCT_LONG_ASSET, Eastmoney per-stock cash-flow statement), CNY, period-to-date
    key: true
    calibration:
      akshare:
        checked_on: 2026-10-06
        method: >-
          stock_cash_flow_sheet_by_report_em live (600519, 601318, 601398, 600030):
          CONSTRUCT_LONG_ASSET in CNY, NOTICE_DATE / UPDATE_DATE present
  free_cash_flow:
    table: financial
    primary: akshare
    definition: "NETCASH_OPERATE - CONSTRUCT_LONG_ASSET, CNY, period-to-date"
    key: true
    calibration:
      akshare:
        checked_on: 2026-10-06
        method: "derived in the client from the two CNY columns above (same statement row)"

  # -- fiscal-year per-share values (observation multiples pe_fy / pb_fy / ps_fy)
  eps_basic_fy:
    table: derived
    primary: derived
    formula: "net_profit_parent / total_shares"
    definition: >-
      approximates basic EPS of the fiscal year (iFinD ths_eps_basic_stock uses
      weighted-average shares)
  bvps_fy:
    table: derived
    primary: derived
    formula: "total_equity / total_shares"
    definition: >-
      approximates net assets per share, CNY/share (iFinD ths_nav_ps_stock is
      parent equity; total_equity includes minority interests)
  revenue_ps_fy:
    table: derived
    primary: derived
    formula: "revenue_total / total_shares"
    definition: "revenue per share of the fiscal year, CNY/share"

  # -- daily bars (market_snapshot: baostock, tencent close quote fallback) - #
  close:
    table: market
    primary: baostock
    fallback: [tencent]
    tolerance: 0.001
    definition: "close, CNY/share; adjust=none raw, adjust=backward 后复权 (tencent: raw only)"
    calibration:
      baostock:
        checked_on: 2026-10-06
        method: "query_history_k_data_plus live: 600519 close 1258.62 on 2026-09-30 equals iFinD"
      tencent:
        checked_on: 2026-10-09
        method: >-
          qt.gtimg.cn live: field 3 is the last price in CNY/share (600519 1255.79 on
          2026-10-08 after the close); field 4 (previous close) 1258.62 equals the
          baostock 2026-09-30 close
  open:
    table: market
    primary: baostock
    fallback: [tencent]
    tolerance: 0.001
    definition: "open, CNY/share (adjust=none)"
    calibration:
      tencent:
        checked_on: 2026-10-09
        method: "qt.gtimg.cn live: field 5 open in CNY/share (600519 1252.90 on 2026-10-08)"
  high:
    table: market
    primary: baostock
    fallback: [tencent]
    tolerance: 0.001
    definition: "day high, CNY/share (adjust=none)"
    calibration:
      tencent:
        checked_on: 2026-10-09
        method: "qt.gtimg.cn live: field 33 high in CNY/share (600519 1258.00 on 2026-10-08)"
  low:
    table: market
    primary: baostock
    fallback: [tencent]
    tolerance: 0.001
    definition: "day low, CNY/share (adjust=none)"
    calibration:
      tencent:
        checked_on: 2026-10-09
        method: "qt.gtimg.cn live: field 34 low in CNY/share (600519 1242.00 on 2026-10-08)"
  volume:
    table: market
    primary: baostock
    fallback: [tencent]
    tolerance: 0.001
    definition: "volume, shares (baostock volume; tencent field 6 in 手 x 100)"
    calibration:
      tencent:
        checked_on: 2026-10-09
        method: >-
          qt.gtimg.cn live: field 6 is lots of 100 shares (600519 25168 手 on 2026-10-08;
          field 35 price/volume/amount repeats it), stored x 100
  amount:
    table: market
    primary: baostock
    fallback: [tencent]
    tolerance: 0.001
    definition: "turnover amount, CNY (baostock amount; tencent field 37 in 万元 x 1e4)"
    calibration:
      tencent:
        checked_on: 2026-10-09
        method: >-
          qt.gtimg.cn live: field 37 is 万元 (600519 314541 on 2026-10-08 while field 35
          carries the exact 3145413157 CNY), stored x 10000; rounding to 1 万元 keeps the
          relative error far below the tolerance for CSI 300 turnover
  pe_ttm:
    table: market
    primary: baostock
    definition: "close / TTM EPS (peTTM), ratio (times)"
  pb_mrq:
    table: market
    primary: baostock
    definition: "close / latest-quarter BVPS (pbMRQ), ratio (times)"
  ps_ttm:
    table: market
    primary: baostock
    definition: "close / TTM revenue per share (psTTM), ratio (times)"
  turnover:
    table: market
    primary: baostock
    fallback: [tencent]
    tolerance: 0.001
    definition: "turn percent / 100, fraction of float shares traded"
    calibration:
      tencent:
        checked_on: 2026-10-09
        method: >-
          qt.gtimg.cn live: field 38 is a percent (600519 0.20 on 2026-10-08, 000001 0.76),
          stored / 100 like the baostock turn
  is_st:
    table: market
    primary: baostock
    definition: "flag: 1 when ST / *ST"
  trade_status:
    table: market
    primary: baostock
    definition: "flag: 1 trading, 0 suspended"

  # -- disclosure ---------------------------------------------------------- #
  report_overdue:
    table: report_overdue
    primary: baostock
    definition: "flag: periodic report past its statutory deadline without a baostock pubDate"

  # -- dividends (dividend_event, F2 / Q2) ------------------------------------ #
  cash_dividend_per_share:
    table: dividend
    primary: baostock
    definition: >-
      pre-tax cash dividend per share of one distribution, CNY/share (baostock
      query_dividend_data dividCashPsBeforeTax, numeric column; the text column
      dividCashStock "10派…元" is per 10 shares and not used), keyed by ex-date
      (dividOperateDate); public from the plan announcement (dividPlanAnnounceDate)

  # -- earnings events (Eastmoney via akshare; facts, not factors) ----------- #
  forecast_profit_low:
    table: earnings
    primary: akshare
    definition: >-
      lower bound of the forecast net profit of the period, CNY (yuan); the
      归属于上市公司股东的净利润 line (code 004), else 扣除非经常性损益后的净利润
      (005); equal to forecast_profit_high for a point estimate
    calibration:
      akshare:
        checked_on: 2026-10-09
        method: >-
          stock_yjyg_em(date="20260630") live: the datacenter row keeps PREDICT_AMT_LOWER /
          PREDICT_AMT_UPPER (600030 2026H1 23343000000 both = 233.43 亿元 in the 业绩变动 text;
          000002 -15000000000 / -12000000000 = 亏损 120 亿元至 150 亿元); akshare's frame only
          keeps the midpoint 预测数值 = FORECAST_JZ
  forecast_profit_high:
    table: earnings
    primary: akshare
    definition: "upper bound of the forecast net profit of the period, CNY (yuan)"
    calibration:
      akshare:
        checked_on: 2026-10-09
        method: "stock_yjyg_em live: PREDICT_AMT_UPPER (see forecast_profit_low)"
  forecast_yoy_low:
    table: earnings
    primary: akshare
    definition: >-
      lower bound of the forecast year-on-year change of the net profit,
      fraction (ADD_AMP_LOWER percent / 100)
    calibration:
      akshare:
        checked_on: 2026-10-09
        method: >-
          stock_yjyg_em live: ADD_AMP_LOWER 70.15 for 600030 2026H1 = "同比上年增长:70.15%"
          in the 业绩变动 text; -25.56 / -0.45 for 000002 = 亏损扩大 0.45% 至 25.56%
  forecast_yoy_high:
    table: earnings
    primary: akshare
    definition: >-
      upper bound of the forecast year-on-year change of the net profit,
      fraction (ADD_AMP_UPPER percent / 100)
    calibration:
      akshare:
        checked_on: 2026-10-09
        method: "stock_yjyg_em live: ADD_AMP_UPPER (see forecast_yoy_low)"
  disclosure_scheduled_days:
    table: earnings
    primary: akshare
    definition: >-
      days from the capture date to the appointed disclosure date of the
      period (the latest 变更日期, else 首次预约时间; disclosure_schedule.scheduled_date)
    calibration:
      akshare:
        checked_on: 2026-10-09
        method: >-
          stock_yysj_em(symbol="沪深A股", date="20260930") live: 首次预约时间 2026-10-10 for
          002107 with RESIDUAL_DAYS 1 on the 2026-10-09 capture; 300633 一次变更日期 2026-10-29
          equals the site's APPOINT_PUBLISH_DATE; 实际披露时间 null for all 5223 rows
  segment_revenue:
    table: earnings
    primary: akshare
    definition: "revenue of one 主营构成 segment of the period, CNY (yuan)"
    calibration:
      akshare:
        checked_on: 2026-10-09
        method: >-
          stock_zygc_em(symbol="SH600519") live: 茅台酒 2026H1 主营收入 77724437925.48 =
          777.24 亿元 (annual report scale); 收入比例 0.856909 + 其他系列酒 0.142599 +
          其他(补充) 0.000492 = 1.0
  segment_profit:
    table: earnings
    primary: akshare
    definition: "gross profit of one 主营构成 segment of the period, CNY (yuan)"
    calibration:
      akshare:
        checked_on: 2026-10-09
        method: >-
          stock_zygc_em live: 茅台酒 2026H1 主营利润 71723553696.78 = 主营收入 - 主营成本
          (77724437925.48 - 6000884228.70)
  segment_share:
    table: earnings
    primary: akshare
    definition: "share of the segment in main-business revenue, fraction (收入比例)"
    calibration:
      akshare:
        checked_on: 2026-10-09
        method: "stock_zygc_em live: 收入比例 0.856909 (a fraction, not percent; see segment_revenue)"
  segment_margin:
    table: earnings
    primary: akshare
    definition: "gross margin of the segment, fraction (毛利率 = 主营利润 / 主营收入)"
    calibration:
      akshare:
        checked_on: 2026-10-09
        method: >-
          stock_zygc_em live: 茅台酒 2026H1 毛利率 0.922793 = 71723553696.78 / 77724437925.48
