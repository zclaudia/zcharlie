# Schedules below are DEFAULTS FOR THE FIRST IMPORT ONLY: on first start they
# are copied into the database and then managed at /app/settings (or with
# `ia settings`); later edits here are ignored. `scheduler.a_share_calendar_path`
# is still read from this file. See docs/product/settings-plan.md.
scheduler:
  # Watchlist research reads the snapshot store (P1-B5, source mode
  # "snapshot"), so it runs after the evening baostock market snapshot
  # (snapshot.market_snapshot_cron, 18:30) has stored the day's bars.
  watchlist_refresh_cron: "30 19 * * 1-5"
  watchlist_refresh_timezone: Asia/Shanghai
  a_share_calendar_path: config/calendars/a_share.yaml

# PIT snapshot collection (P1-A5, P1-A7). The scheduler only enqueues; the
# worker executes. Target-pool market / financial jobs use baostock (free, no
# iFinD quota); iFinD is reserved for watchlist depth (decision D6). Cron
# fields are in `timezone`; a null cron disables a job.
snapshot:
  universes: [CSI300]
  timezone: Asia/Shanghai
  universe_sync_cron: "0 8 * * 1"        # Monday 08:00
  industry_sync_cron: "0 8 * * *"        # gated: first trading day of the month
  # gated: trading day. baostock publishes daily bars in the evening; 18:30
  # leaves a margin - TODO confirm against the actual publish time on a
  # regular trading day (could not be verified on the 2026 National Day break).
  market_snapshot_cron: "30 18 * * 1-5"
  # gated: trading day. Tencent batch quotes store the same-day close right
  # after the 15:00 close (target pool + watchlist + candidates + holdings);
  # the 16:00 retry collects what was still pending at 15:10.
  close_quote_cron: "10 15 * * 1-5"
  close_quote_retry_cron: "0 16 * * 1-5"
  financial_weekly_cron: "0 9 * * 6"     # Saturday 09:00
  # gated: first trading day after 04-30/08-31/10-31; also flags overdue
  # reports (report_overdue). Evening, so deadline-day reports reach baostock.
  financial_deadline_cron: "0 19 * * *"

# Weekly template screen (P1-C3): one screen_run per universe; the worker
# syncs config/rule_templates, screens the target pool and stores
# screen_result rows. Cron fields are in `timezone` (Sunday 20:00).
screen:
  universes: [CSI300]
  timezone: Asia/Shanghai
  cron: "0 20 * * 0"     # Sunday 20:00 (standard crontab weekdays, 0 = Sunday)
  hit_cap: 20

# Candidates (P1-D1): daily sweep moving open candidates past expires_at to
# `expired` (a system decision each). Expiry / dismiss cooldown lengths are
# env settings (CANDIDATE_EXPIRY_DAYS, CANDIDATE_DISMISS_COOLDOWN_DAYS).
candidates:
  timezone: Asia/Shanghai
  expiry_sweep_cron: "0 7 * * *"   # daily 07:00

# iFinD on-demand verification (P1-A13). The dispatcher enqueues one
# ifind_verify run per slot when requests are due (pending, or deferred past
# their not_before); runs stay within IFIND_BUDGET_PER_5H calls per rolling
# 5 hours. Weekly calibration samples watchlist stocks (deterministic per ISO
# week). Standard crontab weekdays (0 = Sunday); null disables a job.
verification:
  timezone: Asia/Shanghai
  dispatch_cron: "*/30 * * * *"
  calibration_cron: "0 21 * * 0"   # Sunday 21:00
  calibration_count: 10
