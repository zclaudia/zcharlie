# Golden corpus manifest for the deterministic research kernel.
#
# Selection policy (docs/product/mvp-completion-plan.md, work package A1):
# samples are chosen by coverage characteristics first, then each ticker is
# confirmed against real iFinD availability while collecting fixtures in
# work package A2. Fixture inputs are captured through ifind-proxy, sanitized
# of credentials, request headers and user paths, then frozen for offline
# parity tests. The legacy my-stocks 0.3.0 output stays a read-only golden
# oracle; production and tests never depend on the user directory.
#
# Sample directory convention: tests/fixtures/research_kernel/<6-digit symbol>.
# Boundary traits are selection hypotheses that are confirmed against the
# captured data; when the data disagrees the notes below record what was
# actually observed. Trait labels are never removed silently.

manifest_schema_version: 1
created_at: "2026-10-05"
canonical_schema_version: "ifind-canonical.v1"
scoring_version: "v1.3"
score_schema_version: "v2.2"
report_year: 2025
fixture_policy:
  provider: ifind-proxy
  sanitized: true
  offline: true

coverage_requirements:
  min_samples: 12
  max_samples: 20
  min_per_exchange:
    SSE: 4
    SZSE: 4
    BSE: 0
  blocked_exchanges:
    BSE:
      required_when_available: 2
      reason: >-
        agent_gw/iFinD 网关在 2026-10-05 采集时对全部北交所代码（835185.BJ、836077.BJ、
        430047.BJ 实测）的行情接口持续返回上游错误：/stock/history（日/周线均失败）与
        /stock/realtime 均不可用，而 /stock/info 与 /financial/* 正常。按 completion plan
        A1 的选样规则（"先按特征选样，再以 iFinD 实际可用性确定代码"），两只北交所样本
        暂由沪/深小盘样本替代并保留原特征标签；待网关恢复北交所行情后必须补回不少于
        2 只北交所样本。
  business_categories:
    - bank_finance
    - consumer
    - high_end_manufacturing
    - cyclical_resource
    - software_asset_light
    - high_growth
  min_per_boundary_trait:
    key_missing_fields: 2
    low_or_negative_profitability: 1
    borderline_freshness: 1
    low_model_fit: 1
  scales:
    - large_cap
    - mid_cap
    - small_cap

