{% extends "base.html" %}
{% block content %}
<header class="page-head">
  <h1>数据健康</h1>
  <p class="muted">采集完整率、数据新鲜度、快照积累（P1 阶段退出指标）、历史回补、iFinD 核对与上游调用。除交易日历卡片（核对 / 应用候选）外均为只读汇总。</p>
</header>
<div id="data-health" class="data-region"
     data-endpoint="/health/data"
     aria-live="polite">
  <p class="notice notice-loading" data-state="loading">正在加载…</p>
</div>
<section id="health-warnings" class="card health-section" hidden>
  <h2>提醒</h2>
  <div data-health-section="warnings"></div>
</section>
<section id="health-calendar" class="card health-section" hidden>
  <h2>交易日历</h2>
  <div id="calendar-card" aria-live="polite"></div>
</section>
<div class="grid-2">
  <section id="health-accumulation" class="card health-section" hidden>
    <h2>快照积累</h2>
    <div data-health-section="accumulation"></div>
  </section>
  <section id="health-freshness" class="card health-section" hidden>
    <h2>数据新鲜度</h2>
    <div data-health-section="freshness"></div>
  </section>
</div>
<section id="health-collections" class="card health-section" hidden>
  <h2>采集任务</h2>
  <div data-health-section="collections"></div>
</section>
<div class="grid-2">
  <section id="health-universes" class="card health-section" hidden>
    <h2>目标池成分</h2>
    <div data-health-section="universes"></div>
  </section>
  <section id="health-industry" class="card health-section" hidden>
    <h2>行业分类</h2>
    <div data-health-section="industry"></div>
  </section>
</div>
<section id="health-backfill" class="card health-section" hidden>
  <h2>历史回补</h2>
  <div data-health-section="backfill"></div>
</section>
<section id="health-verification" class="card health-section" hidden>
  <h2>iFinD 核对</h2>
  <div data-health-section="verification"></div>
</section>
<section id="health-overdue" class="card health-section" hidden>
  <h2>逾期财报</h2>
  <div data-health-section="overdue"></div>
</section>
<section id="health-providers" class="card health-section" hidden>
  <h2>上游调用</h2>
  <div data-health-section="providers"></div>
</section>
{% endblock %}
