{% extends "base.html" %}
{% block page_css %}<link rel="stylesheet" href="{{ static_url('pages/templates.css') }}">{% endblock %}
{% block mobile_back %}<a href="/app/templates">模板</a>{% endblock %}
{% block content %}
<header class="page-head tpl-d-head">
  <h1 id="template-title" class="keep">模板 {{ template_id }}</h1>
</header>
<div id="template-detail" class="data-region" data-template-id="{{ template_id }}" aria-live="polite">
  <p class="notice notice-loading" data-state="loading">正在加载…</p>
</div>
<noscript>
  <p class="notice notice-warn">模板页需要 JavaScript：查看条件、起草新版本与激活回滚都在此处进行。</p>
</noscript>
{% endblock %}
