{% extends "base.html" %}
{% block content %}
<header class="page-head">
  <h1>单股研究 <span class="code">{{ ticker }}</span></h1>
  <p class="muted">确定性评分、关键指标、数据新鲜度与 AI 解释；结论在上，证据可展开。</p>
</header>
<section class="card">
  <div class="toolbar">
    <form id="stock-run-form" class="inline-form">
      <input name="industry" placeholder="行业（可选）">
      <input type="hidden" name="ticker" value="{{ ticker }}">
      <button type="submit" class="primary">运行研究</button>
    </form>
  </div>
  <div id="stock-run-result" class="data-region" aria-live="polite"></div>
</section>
<section class="card spark-card">
  <div class="card-head">
    <h2 id="stock-spark-title">近 240 个交易日收盘价</h2>
    <span class="faint">不复权，仅展示已入库日线</span>
  </div>
  <div id="stock-spark" class="spark-host" data-ticker="{{ ticker }}"></div>
</section>
<section id="stock-detail" class="data-region"></section>
<div class="grid-2">
  <section class="card">
    <h2>自上次以来的变化</h2>
    <div id="stock-changes" class="data-region"
         data-empty-text="暂无与上一次快照的对比。">
      <p class="notice notice-loading" data-state="loading">正在加载…</p>
    </div>
  </section>
  <section class="card">
    <h2>历史快照</h2>
    <div id="stock-history" class="data-region"
         data-endpoint="/research/stocks/{{ ticker }}/history"
         data-empty-text="尚无研究快照；请先运行一次研究。">
      <p class="notice notice-loading" data-state="loading">正在加载…</p>
    </div>
  </section>
</div>
{% endblock %}
