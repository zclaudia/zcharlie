{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>单股研究 {{ ticker }}</h1>
  <p class="muted">分数、因子、证据、缺失项与历史变化。</p>
  <div class="toolbar">
    <form id="stock-run-form" class="inline-form">
      <input name="industry" placeholder="行业（首次研究必填）" required>
      <input type="hidden" name="ticker" value="{{ ticker }}">
      <button type="submit" class="primary">运行研究</button>
    </form>
  </div>
  <div id="stock-run-result" class="data-region" aria-live="polite"></div>
  <section id="stock-detail" class="data-region"></section>
  <section class="card">
    <h2>自上次以来的变化</h2>
    <div id="stock-changes" class="data-region"
         data-empty-text="暂无与上一次快照的对比。">
      <p class="notice notice-loading" data-state="loading">正在加载…</p>
    </div>
  </section>
  <section class="card">
    <h2>历史快照</h2>
    <div id="stock-history" class="data-region"
         data-endpoint="/research/stocks/{{ ticker }}/history"
         data-empty-text="尚无研究快照；请先运行一次研究。">
      <p class="notice notice-loading" data-state="loading">正在加载…</p>
    </div>
  </section>
</section>
{% endblock %}
