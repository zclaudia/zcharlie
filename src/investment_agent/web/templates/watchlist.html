{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>自选股</h1>
  <p class="muted">最新评分、置信度、freshness 与变化时间。</p>
  <div class="toolbar">
    <form id="watchlist-add-form" class="inline-form" data-endpoint="/watchlist" method="post">
      <input name="ticker" placeholder="代码，如 600406.SH" required>
      <input name="industry" placeholder="行业，如 电力设备" required>
      <input name="name" placeholder="名称（可选）">
      <input name="report_year" type="number" min="1990" max="2100" value="2025" required>
      <button type="submit" class="primary">添加</button>
    </form>
    <button id="watchlist-refresh-all" class="secondary"
            data-endpoint="/watchlist/refresh">刷新全部</button>
  </div>
  <div id="watchlist-list" class="data-region"
       data-endpoint="/watchlist"
       data-empty-text="自选股为空；添加一只 A 股开始研究。">
    <p class="notice notice-loading" data-state="loading">正在加载…</p>
  </div>
  <div id="watchlist-refresh-results" class="data-region" aria-live="polite"></div>
</section>
{% endblock %}
