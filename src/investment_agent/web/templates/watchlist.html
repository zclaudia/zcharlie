{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block page_css %}<link rel="stylesheet" href="/app/static/pages/watchlist.css">{% endblock %}
{% block appbar_actions %}
<button type="button" class="icon-btn" data-overlay-open="watchlist-add-drawer" aria-controls="watchlist-add-drawer" aria-label="添加股票">{{ icon("plus", "ico", 21) }}</button>
<button type="button" class="icon-btn" id="watchlist-refresh-proxy" aria-label="刷新全部">{{ icon("refresh", "ico", 20) }}</button>
{% endblock %}
{% block content %}
{% include "_funnel_seg.html" %}
<header class="page-head">
  <h1>观察池</h1>
  <p class="muted">长期跟踪的标的：规则起草与审批、最新评分、数据新鲜度与变化。</p>
  <div class="page-actions only-desktop">
    <button type="button" class="btn btn-sm" data-overlay-open="watchlist-add-drawer" aria-controls="watchlist-add-drawer" aria-expanded="false">{{ icon("plus", "ico", 14) }}添加</button>
    <button id="watchlist-refresh-all" type="button" class="btn btn-sm"
            data-endpoint="/watchlist/refresh">刷新全部</button>
  </div>
</header>

<div id="watchlist-filters" class="wl-filters">
  <div class="toolbar only-desktop">
    <div class="seg" role="group" aria-label="筛选观察池">
      <button type="button" class="on" aria-pressed="true" data-watch-filter="all">全部 <span class="c" data-filter-count="all"></span></button>
      <button type="button" aria-pressed="false" data-watch-filter="changed">有变化 <span class="c" data-filter-count="changed"></span></button>
      <button type="button" aria-pressed="false" data-watch-filter="pending">待研究 <span class="c" data-filter-count="pending"></span></button>
      <button type="button" aria-pressed="false" data-watch-filter="disabled">已停用 <span class="c" data-filter-count="disabled"></span></button>
    </div>
    <input type="search" id="watchlist-filter-text" class="wl-search" placeholder="筛选股票" aria-label="按名称、代码或行业筛选" autocomplete="off">
    <span id="watchlist-count" class="faint wl-count" aria-live="polite"></span>
  </div>
  <div class="chip-scroll only-mobile" role="group" aria-label="筛选观察池">
    <button type="button" class="filter-chip on" aria-pressed="true" data-watch-filter="all">全部 <span class="c" data-filter-count="all"></span></button>
    <button type="button" class="filter-chip" aria-pressed="false" data-watch-filter="changed">有变化 <span class="c" data-filter-count="changed"></span></button>
    <button type="button" class="filter-chip" aria-pressed="false" data-watch-filter="pending">待研究 <span class="c" data-filter-count="pending"></span></button>
    <button type="button" class="filter-chip" aria-pressed="false" data-watch-filter="disabled">已停用 <span class="c" data-filter-count="disabled"></span></button>
  </div>
</div>

<div id="watchlist-refresh-results" class="data-region" aria-live="polite"></div>
<section class="card card--flush wl-card">
  <div id="watchlist-list" class="data-region"
       data-endpoint="/watchlist"
       data-empty-text="观察池为空；点击“添加”开始跟踪一只 A 股。">
    <p class="notice notice-loading" data-state="loading">正在加载…</p>
  </div>
</section>

<aside class="drawer" id="watchlist-add-drawer" role="dialog" aria-modal="true" aria-labelledby="watchlist-add-title">
  <form id="watchlist-add-form" class="drawer-form wl-add-form" data-endpoint="/watchlist" method="post">
    <div class="drawer-head">
      <div><h2 id="watchlist-add-title">添加到观察池</h2><div class="sub">跟踪一只 A 股：自动带出行业与年报年度，并起草规则</div></div>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" data-overlay-close aria-label="关闭">{{ icon("close", "ico", 18) }}</button>
    </div>
    <div class="drawer-body">
      <div class="field">
        <label for="watchlist-add-ticker">股票</label>
        <input id="watchlist-add-ticker" name="ticker" placeholder="代码 / 名称 / 拼音，如 山东、600547 或 sdhj" maxlength="32" required aria-label="代码" autocomplete="off" data-autofocus>
      </div>
      <div class="form-grid wl-add-grid">
        <div class="field">
          <label for="watchlist-add-industry">行业</label>
          <input id="watchlist-add-industry" name="industry" placeholder="行业（自动填充，可修改）" aria-label="行业">
        </div>
        <div class="field">
          <label for="watchlist-add-name">名称 <span class="faint">可选</span></label>
          <input id="watchlist-add-name" name="name" placeholder="名称（可选）" aria-label="名称">
        </div>
        <div class="field">
          <label for="watchlist-add-year">年报年度</label>
          <input id="watchlist-add-year" name="report_year" type="number" min="1990" max="2100" placeholder="年报年度" title="最新已披露的年报年度，可修改" required aria-label="报告年度">
        </div>
        <div class="field">
          <label for="watchlist-add-template">起草模板</label>
          <select id="watchlist-add-template" name="template_id" aria-label="起草模板">
            <option value="auto" selected>AI 推荐模板（自动起草）</option>
          </select>
        </div>
      </div>
      <div id="watchlist-add-result" class="data-region" aria-live="polite"></div>
    </div>
    <div class="drawer-foot">
      <button type="button" class="btn" data-overlay-close>取消</button>
      <button type="submit" class="btn btn-primary primary">添加</button>
    </div>
  </form>
</aside>

<div class="sheet wl-sheet" id="watchlist-action-sheet" role="dialog" aria-modal="true" aria-labelledby="watchlist-sheet-title">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <div class="wl-sheet-title">
      <h2 id="watchlist-sheet-title"></h2>
      <div class="sub" id="watchlist-sheet-sub"></div>
    </div>
  </div>
  <div class="list-group" id="watchlist-sheet-actions"></div>
  <div class="list-group wl-sheet-danger" id="watchlist-sheet-danger"></div>
</div>

<template id="watchlist-sheet-icons">
  <svg data-icon="open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 4v3M7 15v5M17 3v5M17 15v6"/><rect x="5" y="7" width="4" height="8" rx="1"/><rect x="15" y="8" width="4" height="7" rx="1"/></svg>
  <svg data-icon="draft" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
  <svg data-icon="pause" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 5v14M16 5v14"/></svg>
  <svg data-icon="play" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 4.5v15l12-7.5z"/></svg>
  <svg data-icon="trash" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
</template>
{% endblock %}
