{% extends "base.html" %}
{% block content %}
<header class="page-head">
  <h1>设置</h1>
  <p class="muted">运行参数保存在数据库中，修改后无需重启：标注“立即生效”的下一次读取即用新值，“下个任务生效”在 worker 的下一个任务生效，“重新排期”由调度器在一分钟内重建任务。</p>
</header>
<div id="settings-encryption" class="notice notice-warn" hidden></div>
<div id="settings-form" class="data-region"
     data-endpoint="/settings"
     aria-live="polite">
  <p class="notice notice-loading" data-state="loading">正在加载…</p>
</div>
<section id="settings-savebar" class="card settings-savebar" aria-live="polite" hidden>
  <div class="settings-savebar-row">
    <span id="settings-dirty-count" class="settings-dirty-count">没有未保存的修改</span>
    <input id="settings-note" maxlength="500" placeholder="变更说明（可选）" aria-label="变更说明">
    <button type="button" id="settings-save" class="primary" disabled>保存</button>
    <button type="button" id="settings-discard" disabled>放弃</button>
  </div>
  <div id="settings-save-result" class="issues"></div>
</section>
<section class="card">
  <div class="card-head">
    <h2>最近变更</h2>
    <span class="faint">最新在前，密钥只记录“已设置 / 末 4 位”</span>
  </div>
  <div id="settings-history" class="data-region"
       data-endpoint="/settings/history?limit=30"
       data-empty-text="还没有变更记录。"
       aria-live="polite">
    <p class="notice notice-loading" data-state="loading">正在加载…</p>
  </div>
</section>
<section class="card">
  <div class="card-head">
    <h2>启动配置（只读）</h2>
    <span class="faint">来自环境变量 / .env，修改后需重启服务</span>
  </div>
  <div id="settings-bootstrap" class="data-region" aria-live="polite">
    <p class="notice notice-loading" data-state="loading">正在加载…</p>
  </div>
</section>
{% endblock %}
