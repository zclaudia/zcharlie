<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ page_title or "个人投资研究台" }}{% endblock %} · zcharlie</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/app/static/brand/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/app/static/brand/icon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/app/static/brand/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/app/static/brand/icon-180.png">
  <link rel="stylesheet" href="/app/static/app.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/app">
      <img class="brand-icon" src="/app/static/brand/icon-64.png" width="40" height="40" alt="">
      <span>zcharlie 研究台</span>
    </a>
    <nav class="app-nav" aria-label="主导航">
      <a href="/app" {% if active_nav == "overview" %}class="active" aria-current="page"{% endif %}>今日概览</a>
      <a href="/app/candidates" {% if active_nav == "candidates" %}class="active" aria-current="page"{% endif %}>候选</a>
      <a href="/app/watchlist" {% if active_nav == "watchlist" %}class="active" aria-current="page"{% endif %}>自选股</a>
      <a href="/app/runs" {% if active_nav == "runs" %}class="active" aria-current="page"{% endif %}>运行中心</a>
      <a href="/app/health" {% if active_nav == "health" %}class="active" aria-current="page"{% endif %}>数据健康</a>
      <form method="post" action="/app/logout" class="logout-form">
        <button type="submit" class="link-button">退出</button>
      </form>
    </nav>
  </header>
  <main class="app-main">
    {% block content %}{% endblock %}
    <noscript>
      <p class="notice notice-warn">
        此页面的动态数据需要 JavaScript；当前未启用。页面框架与错误提示仍可阅读，
        完整数据请启用 JavaScript 或使用 CLI / HTTP API。
      </p>
    </noscript>
  </main>
  <footer class="app-footer">
    <p>{{ disclaimer }}；所有结论以数据库中的确定性结果为准。</p>
  </footer>
  <script type="module" src="/app/static/app.js"></script>
</body>
</html>
