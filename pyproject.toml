[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-agent"
version = "0.1.0"
description = "Personal A-share research desk"
requires-python = ">=3.13"
dependencies = [
    # Web / API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",

    # CLI
    "typer>=0.12",
    "rich>=13.7",

    # Config / Validation
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",

    # Storage
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",

    # Scheduler
    "apscheduler>=3.10",

    # Reference data (index constituents, CSRC industries)
    "baostock>=0.9.4",
    # Shenwan 2021 industries (P1-A9); scraper wrapper, pinned to a minor version
    "akshare>=1.19.1,<1.20",
    "certifi",

    # LLM
    "openai>=1.30",
    "pydantic-ai>=1.0.0",

    # Logging
    "structlog>=24.1",

    # Templating (web UI via fastapi.templating)
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "freezegun>=1.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
ia = "investment_agent.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"investment_agent.providers" = ["certs/*.pem"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests requiring real network (deselect by default)",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]  # line length already enforced by formatter

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "baostock.*", "akshare.*"]
ignore_missing_imports = true
